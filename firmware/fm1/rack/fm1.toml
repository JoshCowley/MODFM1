# FM1 Rack (Lite) firmware, an fm1-base app (fm1-base's tools/build.py reads this). See README.md.
name = "FM1RACK"
id_prefix = "FM-1_78"          # package identity: dev builds FM-1_7800 (chosen for this project; not registered anywhere)
usb_manufacturer = "MODFM1"
usb_product = "FM1 RACK"
words = "words.tsv"
ble = false
# the second core (fm1-base's plat_cpu2_*) renders half the voices (rack.cc render_voices); with the fallback, a unit
# whose second core misbehaves (fm1-base's notes: some FM-1s misread shared RAM) carries on with one core
# no USB audio (8 Nov: Josh doesn't use the FM-1 as a sound card with FM1 Rack): frees its buffers and code; USB-MIDI stays
usb_audio_in = false
usb_audio_out = false
cpu2 = true
cpu2_fallback = true
# the engine and the Mutable modules as C++ units, at -O2 (for speed: -Os was 36 KB smaller but about 15 % slower, measured 4 Nov 2026; back to -O2 on 8 Nov) with -fdata-sections (unused tables dropped: 46 KB, same code); the rest (unity_opt below) at -Oz, with the FM-1's float flags (build.py adds -mcpu=r3
# -mfprev1 -ffp-contract=off): units/ is written by make_units.py before each build (gen below)
gen = ["make_units.py", "make_font.py {gen}"]   # (update 51: make_font.py, FM1 Rack's own typeface, over fm1-base's)
o2 = ["units/*.cc"]
o2_cflags = ["-std=gnu++11", "-w", "-fbuiltin", "-fno-exceptions", "-fno-rtti", "-DTEST", "-DRACK_FM1", "-DRACK_LITE",
             "-DRACK_ARENA_KB=308", "-DRACK_ARENA_POOL", "-DRACK_RINGS16", "-O2", "-fdata-sections"]
# FM1 Rack's Plaits shim (first: it stands in for one of Plaits' headers), the Mutable code (a checkout of
# pichenettes/eurorack beside MODFM1)
include = ["../../../engine/shim", "../../../../eurorack"]
# the few C++ standard headers JieLi's toolchain lacks, and C headers for a build with no C library (firmware only)
device_include = ["../../hw/cxx", "../../hw/libc"]
vendored = ["units/"]
licence = "GPL-3.0"               # the firmware as a whole (FM1 Rack's engine); app.c and app.h are MPL-2.0, from fm1-base's template
tagline = "a modular synth voice from Mutable Instruments modules"
credits = "Mutable Instruments' open-source module code (github.com/pichenettes/eurorack)"
boot_pack = true
unity_opt = "z"
